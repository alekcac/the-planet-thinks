# Cloudflare rebuilds the site from every commit on main, and the build asks the server what
# it has measured: the edit rate in the stats page title, which countries are active enough to
# sitemap, and which finished days need a page. Days are the reason this runs daily rather than
# weekly — a day that closed at midnight UTC has no address until the next build.
name: refresh-figures
on:
  schedule:
    - cron: '17 5 * * *' # daily: a day that closed at midnight UTC needs a page the same morning
  workflow_dispatch:

jobs:
  nudge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Commit nothing, so the site rebuilds against today's measurements
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit --allow-empty -m "Rebuild so yesterday has a page and the figures are current"
          git push
